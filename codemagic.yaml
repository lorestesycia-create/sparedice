workflows:
  android-bundle:
    name: SpareDice Play Bundle
    max_build_duration: 60
    environment:
      node: 22
      java: 21
      android_signing:
        - sparedice

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Generate Android
        script: |
          npx cap add android
          npx cap sync android

      - name: Configure Android for Google Play
        script: |
          python3 <<'PY'
          from pathlib import Path
          import re

          variables = Path("android/variables.gradle")
          v = variables.read_text()
          v, c1 = re.subn(
              r'compileSdkVersion\s*=\s*\d+',
              'compileSdkVersion = 36',
              v
          )
          v, c2 = re.subn(
              r'targetSdkVersion\s*=\s*\d+',
              'targetSdkVersion = 36',
              v
          )

          if c1 != 1 or c2 != 1:
              raise SystemExit("ERROR: no se pudo establecer API 36")

          variables.write_text(v)

          gradle = Path("android/app/build.gradle")
          g = gradle.read_text()
          g, c3 = re.subn(
              r'versionCode\s+\d+',
              'versionCode 1',
              g,
              count=1
          )

          if c3 != 1:
              raise SystemExit("ERROR: no se pudo establecer versionCode 1")

          gradle.write_text(g)
          PY

      - name: Configure AdMob
        script: |
          python3 <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          s = manifest.read_text()

          admob = '''        <meta-data
              android:name="com.google.android.gms.ads.APPLICATION_ID"
              android:value="@string/admob_app_id" />
          '''

          s = s.replace("<application", admob + "\n    <application", 1)
          manifest.write_text(s)

          strings = Path("android/app/src/main/res/values/strings.xml")
          s = strings.read_text()
          s = s.replace(
              "</resources>",
              '    <string name="admob_app_id">ca-app-pub-8854680295966508~2209037926</string>\n</resources>',
              1
          )
          strings.write_text(s)
          PY

      - name: Configure release signing
        script: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          marker = "    buildTypes {"

          signing = """    signingConfigs {
              release {
                  storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                  storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("CM_KEY_ALIAS")
                  keyPassword System.getenv("CM_KEY_PASSWORD")
              }
          }
          """

          s = s.replace(marker, signing + marker, 1)

          s = s.replace(
              "        release {",
              "        release {\n            signingConfig signingConfigs.release",
              1
          )

          p.write_text(s)
          PY

      - name: Verify Play configuration
        script: |
          grep "compileSdkVersion = 36" android/variables.gradle
          grep "targetSdkVersion = 36" android/variables.gradle
          grep "versionCode 1" android/app/build.gradle

      - name: Build signed AAB
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

    artifacts:
      - android/app/build/outputs/**/*.aab
